services:
  - type: web
    name: roycash-backend
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: roycash-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/roycash.sqlite
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: ADMIN_SETUP_TOKEN
        sync: false
